<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Math Teacher</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
  h1 { text-align: center; }
  section { margin-bottom: 16px; }
  h2 { font-size: 16px; margin-bottom: 8px; }
  #generate-btn { padding: 8px 12px; width: 100%; }
  #question-display { font-size: 24px; text-align: center; padding: 16px; border: 1px solid #ccc; margin-top: 8px; min-height: 24px; }
  #answer-form { display: flex; gap: 8px; }
  #answer-input { flex: 1; padding: 8px; }
  #answer-form button { padding: 8px 12px; }
  #feedback { text-align: center; padding: 8px; margin-top: 8px; font-weight: bold; }
  #feedback.correct { color: #2ecc71; }
  #feedback.incorrect { color: #e74c3c; }
  #feedback.info { color: #888; }
</style>
</head>
<body>
<h1>AI Math Teacher</h1>

<section>
  <h2>Teacher</h2>
  <button id="generate-btn">Generate Question</button>
  <div id="question-display">Click "Generate Question" to begin</div>
</section>

<section>
  <h2>Examiner</h2>
  <form id="answer-form">
    <input type="number" id="answer-input" placeholder="Your answer" required>
    <button type="submit">Submit</button>
  </form>
  <div id="feedback"></div>
</section>

<script src="script.js"></script>
</body>
</html>
