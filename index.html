<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo List</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
  h1 { text-align: center; }
  #todo-form { display: flex; gap: 8px; margin-bottom: 16px; }
  #todo-input { flex: 1; padding: 8px; }
  #todo-form button { padding: 8px 12px; }
  #todo-list { list-style: none; padding: 0; }
  #todo-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #ccc; }
  #todo-list li button { background: #e74c3c; color: #fff; border: none; padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>
<h1>Todo List</h1>
<form id="todo-form">
  <input type="text" id="todo-input" placeholder="Add a new todo" required>
  <button type="submit">Add</button>
</form>
<ul id="todo-list"></ul>

<script src="script.js"></script>
</body>
</html>
